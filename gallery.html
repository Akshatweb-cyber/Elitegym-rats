<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY | IRON PARADISE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #ffffff; font-family: 'Montserrat', sans-serif; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 30px 10%; background: #0a0a0a; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-family: 'Playfair Display', serif; font-size: 2rem; color: #ff3e3e; }
        nav a { color: #ffffff; text-decoration: none; margin-left: 35px; font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        
        .container { max-width: 1200px; margin: 80px auto; padding: 0 20px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 3rem; text-align: center; margin-bottom: 60px; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
        .gallery-item { position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .gallery-item img { width: 100%; height: 350px; object-fit: cover; display: block; filter: grayscale(100%); transition: filter 0.5s, transform 0.5s; }
        .gallery-item:hover img { filter: grayscale(0%); transform: scale(1.03); }
    </style>
</head>
<body>
    <header>
        <div class="logo">IRON PARADISE</div>
        <nav>
            <a href="index.html">Home</a><a href="services.html">Services</a><a href="plans.html">Plans</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title animate__animated animate__fadeIn">The Spaces</h2>
        <div class="gallery-grid">
            <div class="gallery-item animate__animated animate__zoomIn"><img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd" alt="Gym"></div>
            <div class="gallery-item animate__animated animate__zoomIn animate__delay-1s"><img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48" alt="Weights"></div>
            <div class="gallery-item animate__animated animate__zoomIn animate__delay-2s"><img src="https://images.unsplash.com/photo-1540206276907-fbd6cd1a28a6" alt="Training"></div>
        </div>
    </div>
</body>
</html>
